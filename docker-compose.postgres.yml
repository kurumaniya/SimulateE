# docker compose -f docker-compose.yml -f docker-compose.postgres.yml up -d --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-retroweb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-retroweb}
      POSTGRES_DB: ${POSTGRES_DB:-retroweb}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-retroweb}:${POSTGRES_PASSWORD:-retroweb}@db:5432/${POSTGRES_DB:-retroweb}
    depends_on:
      - db

volumes:
  postgres-data:
